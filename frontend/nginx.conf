limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=operator_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 256k;

    root /usr/share/nginx/html;
    index index.html;

    # Customer and model text is rendered with textContent; the policy is a second
    # line of defence: no inline or third-party scripts, no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /webhooks/ {
        limit_req zone=webhooks burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        limit_req zone=operator_api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Customers receive links to /kb/<slug>; one static page renders any article.
    location ~ ^/kb/[^/]+$ {
        try_files /kb.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
