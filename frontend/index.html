<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets · Helpdesk AI Drafts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Helpdesk AI Drafts</a>
    </div>
  </nav>
  <main class="container pb-5">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
      <div id="counts" class="small"></div>
      <label class="d-flex align-items-center gap-2 mb-0">
        <span class="text-muted small">Status</span>
        <select id="status-filter" class="form-select form-select-sm w-auto"></select>
      </label>
    </div>
    <div class="table-responsive bg-white border rounded">
      <table class="table table-hover mb-0 align-middle">
        <thead>
          <tr><th>Received</th><th>Ticket</th><th>Status</th><th>Message</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="message" class="mt-3"></div>
  </main>
  <script type="module" src="/js/list.js"></script>
</body>
</html>
