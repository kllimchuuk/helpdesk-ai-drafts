name: helpdesk-ai-drafts

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdesk
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/helpdesk
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DAILY_CALL_CAP: ${LLM_DAILY_CALL_CAP:-500}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: ["python", "-m", "workers"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/helpdesk
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DAILY_CALL_CAP: ${LLM_DAILY_CALL_CAP:-500}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-20}
    depends_on:
      # The backend runs the migrations and loads the KB before it is healthy.
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db_data:
